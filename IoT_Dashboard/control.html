<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Control - Smart Car Monitor</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .control-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 25px;
      margin-bottom: 30px;
    }
    
    .control-card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      text-align: center;
      position: relative;
    }
    
    .control-card.locked {
      opacity: 0.7;
      background: #f8f9fa;
    }
    
    .control-card h3 {
      color: #2c3e50;
      margin-bottom: 20px;
      font-size: 1.5em;
    }
    
    .control-status {
      font-size: 48px;
      margin: 20px 0;
    }
    
    .btn-control {
      padding: 15px 40px;
      font-size: 18px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: bold;
      margin: 10px;
    }
    
    .btn-control:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .btn-on {
      background: #2ecc71;
      color: white;
    }
    
    .btn-on:hover:not(:disabled) {
      background: #27ae60;
      transform: scale(1.05);
    }
    
    .btn-off {
      background: #e74c3c;
      color: white;
    }
    
    .btn-off:hover:not(:disabled) {
      background: #c0392b;
      transform: scale(1.05);
    }
    
    .status-badge {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 25px;
      font-weight: bold;
      margin-top: 15px;
    }
    
    .status-on {
      background: #2ecc71;
      color: white;
    }
    
    .status-off {
      background: #e74c3c;
      color: white;
    }
    
    .auto-mode {
      background: #3498db;
      color: white;
      padding: 10px;
      border-radius: 10px;
      margin-top: 15px;
    }
    
    .alert-section {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
    }
    
    .alert-log {
      background: #2c3e50;
      color: #ecf0f1;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .alert-item {
      padding: 8px;
      border-bottom: 1px solid #34495e;
      font-size: 12px;
    }
    
    .logic-info {
      background: #ecf0f1;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      text-align: left;
    }
    
    .temp-high {
      color: #e74c3c;
      font-weight: bold;
    }
    
    .temp-low {
      color: #3498db;
      font-weight: bold;
    }
    
    .lock-message {
      background: #f39c12;
      color: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .lock-message button {
      background: white;
      color: #f39c12;
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    
    .admin-lock-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #e74c3c;
      color: white;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="sidebar">
      <h2>🚗 Smart Car Monitor</h2>
      <div class="user-info" id="userInfo">
        <p>Loading...</p>
      </div>
      <ul class="nav-links">
        <li><a href="dashboard.html">📊 Live Dashboard</a></li>
        <li><a href="logs.html">📋 All Logs</a></li>
        <li><a href="control.html" class="active">🎮 Device Control</a></li>
        <li><a href="profile.html">👤 My Profile</a></li>
        <li id="adminLink" style="display:none;"><a href="admin.html">⚙️ Admin Panel</a></li>
      </ul>
    </div>

    <div class="main-content">
      <header>
        <h1>🎮 Device Control Panel</h1>
        <p>Control AC, Humidifier & Monitor Alerts</p>
      </header>

      <div id="accessMessage"></div>
      <div id="devicesContainer"></div>
    </div>
  </div>

  <script type="module">
    import { db, auth } from "./firebase.js";
    import { ref, onValue, get, set } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    let currentUserRole = "user";
    let userHasAccess = true;
    let currentUserId = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      
      currentUserId = user.uid;
      
      const userSnap = await get(ref(db, `users/${user.uid}`));
      currentUserRole = userSnap.val()?.role || "user";
      
      const userInfo = document.getElementById("userInfo");
      const roleBadge = currentUserRole === "admin" ? "👑 Admin" : "👤 User";
      userInfo.innerHTML = `<p>📧 ${user.email}</p><p>👤 ${userSnap.val()?.fullName || user.displayName || "User"}</p><p>${roleBadge}</p>`;
      
      if (currentUserRole === "admin") {
        document.getElementById("adminLink").style.display = "block";
      }
      
      await checkUserAccess(user.uid);
      await loadUserDevices(user.uid);
    });

    async function checkUserAccess(uid) {
      const accessRef = ref(db, `access_control/${uid}`);
      const snapshot = await get(accessRef);
      
      if (currentUserRole === "admin") {
        userHasAccess = true;
        return;
      }
      
      if (!snapshot.exists()) {
        userHasAccess = true;
        await set(ref(db, `access_control/${uid}`), {
          hasAccess: true,
          updatedBy: "system",
          updatedAt: Date.now()
        });
      } else {
        userHasAccess = snapshot.val().hasAccess === true;
      }
      
      const accessMessageDiv = document.getElementById("accessMessage");
      if (!userHasAccess) {
        accessMessageDiv.innerHTML = `
          <div class="lock-message">
            🔒 <strong>Access Restricted</strong> 🔒
            <p>Your device control access has been temporarily disabled by the administrator.</p>
            <p>Please contact the administrator to renew your subscription or reactivate access.</p>
            <button onclick="contactAdmin()">📧 Contact Administrator</button>
          </div>
        `;
      } else {
        accessMessageDiv.innerHTML = "";
      }
    }

    window.contactAdmin = function() {
      const usersRef = ref(db, "users");
      get(usersRef).then(snapshot => {
        if (snapshot.exists()) {
          const users = snapshot.val();
          for (const uid in users) {
            if (users[uid].role === "admin") {
              const adminEmail = users[uid].email;
              window.location.href = `mailto:${adminEmail}?subject=Device Control Access Request&body=Hello Administrator,%0D%0A%0D%0AI would like to request reactivation of my device control access.%0D%0A%0D%0AThank you.`;
              break;
            }
          }
        }
      });
    };

    async function loadUserDevices(uid) {
      const container = document.getElementById("devicesContainer");
      container.innerHTML = "<p style='text-align:center;'>Loading devices...</p>";
      
      let userDevices = [];
      
      if (currentUserRole === "admin") {
        const devicesRef = ref(db, "devices");
        const devicesSnap = await get(devicesRef);
        if (devicesSnap.exists()) {
          devicesSnap.forEach(device => {
            userDevices.push(device.key);
          });
        }
      } else {
        const assignmentsRef = ref(db, "assignments");
        const assignmentsSnap = await get(assignmentsRef);
        if (assignmentsSnap.exists()) {
          assignmentsSnap.forEach(assignment => {
            if (assignment.val().uid === uid) {
              userDevices.push(assignment.key);
            }
          });
        }
      }
      
      if (userDevices.length === 0) {
        container.innerHTML = `<div class="card"><h3>⚠️ No Devices Available</h3><p>No devices are available for control.</p></div>`;
        return;
      }
      
      container.innerHTML = "";
      
      for (const deviceId of userDevices) {
        createControlPanel(deviceId, container);
        
        const sensorRef = ref(db, `logs/${deviceId}`);
        onValue(sensorRef, (snapshot) => {
          let latestTemp = 0, latestHum = 0;
          snapshot.forEach(child => {
            latestTemp = child.val().temperature;
            latestHum = child.val().humidity;
          });
          updateAutoLogic(deviceId, latestTemp, latestHum);
        });
      }
    }
    
    function createControlPanel(deviceId, container) {
      const isAdmin = currentUserRole === "admin";
      const hasAccess = userHasAccess || isAdmin;
      
      const panel = document.createElement("div");
      panel.innerHTML = `
        <h2 style="margin: 20px 0 20px 0;">📟 Controlling: ${deviceId}</h2>
        
        <div class="control-panel">
          <div class="control-card ${!hasAccess ? 'locked' : ''}">
            ${!hasAccess ? '<div class="admin-lock-badge">🔒 Access Locked</div>' : ''}
            <h3>❄️ Air Conditioner</h3>
            <div class="control-status" id="ac-status-${deviceId}">
              <span class="status-badge status-off">● OFF</span>
            </div>
            <div>
              <button class="btn-control btn-on" onclick="controlDevice('${deviceId}', 'ac', 'ON')" ${!hasAccess ? 'disabled' : ''}>🔴 Turn ON</button>
              <button class="btn-control btn-off" onclick="controlDevice('${deviceId}', 'ac', 'OFF')" ${!hasAccess ? 'disabled' : ''}>⚪ Turn OFF</button>
            </div>
            <div class="auto-mode" id="ac-auto-${deviceId}">🤖 Auto Mode: <span id="ac-auto-status-${deviceId}">Disabled</span></div>
            ${!hasAccess ? '<p style="color:#e74c3c; margin-top:10px; font-size:12px;">⛔ Access blocked. Contact admin.</p>' : ''}
          </div>
          
          <div class="control-card ${!hasAccess ? 'locked' : ''}">
            ${!hasAccess ? '<div class="admin-lock-badge">🔒 Access Locked</div>' : ''}
            <h3>💧 Humidifier</h3>
            <div class="control-status" id="humidifier-status-${deviceId}">
              <span class="status-badge status-off">● OFF</span>
            </div>
            <div>
              <button class="btn-control btn-on" onclick="controlDevice('${deviceId}', 'humidifier', 'ON')" ${!hasAccess ? 'disabled' : ''}>💨 Turn ON</button>
              <button class="btn-control btn-off" onclick="controlDevice('${deviceId}', 'humidifier', 'OFF')" ${!hasAccess ? 'disabled' : ''}>⚪ Turn OFF</button>
            </div>
            <div class="auto-mode" id="humidifier-auto-${deviceId}">🤖 Auto Mode: <span id="humidifier-auto-status-${deviceId}">Disabled</span></div>
            ${!hasAccess ? '<p style="color:#e74c3c; margin-top:10px; font-size:12px;">⛔ Access blocked. Contact admin.</p>' : ''}
          </div>
        </div>
        
        <div class="logic-info">
          <h4>🧠 Smart Logic Rules</h4>
          <ul>
            <li>🌡️ <strong>AC Logic:</strong> Turns ON when temperature > 30°C, OFF when temperature < 25°C</li>
            <li>💧 <strong>Humidifier Logic:</strong> Turns ON when humidity < 40%, OFF when humidity > 60%</li>
            <li>📱 <strong>Alerts:</strong> GSM sends SMS when temperature exceeds 35°C or drops below 10°C</li>
          </ul>
          <div id="current-readings-${deviceId}" style="margin-top: 10px; padding: 10px; background: #fff; border-radius: 8px;">
            📊 Current: Temp = --°C | Humidity = --%
          </div>
        </div>
        
        <div class="alert-section">
          <h3>🚨 Emergency Alerts (GSM SIM800L)</h3>
          <p>📱 SMS will be sent to registered phone numbers when:</p>
          <ul>
            <li>⚠️ Temperature > 35°C (Dangerous heat)</li>
            <li>❄️ Temperature < 10°C (Freezing risk)</li>
            <li>🔥 Rapid temperature rise detected</li>
          </ul>
          <div class="alert-log" id="alert-log-${deviceId}">
            <div class="alert-item">📡 Waiting for alerts...</div>
          </div>
        </div>
      `;
      
      container.appendChild(panel);
      
      if (hasAccess) {
        const acRef = ref(db, `controls/${deviceId}/ac`);
        const humidifierRef = ref(db, `controls/${deviceId}/humidifier`);
        
        onValue(acRef, (snapshot) => {
          const status = snapshot.val() || "OFF";
          const statusSpan = document.querySelector(`#ac-status-${deviceId} span`);
          if (statusSpan) {
            statusSpan.className = `status-badge ${status === "ON" ? "status-on" : "status-off"}`;
            statusSpan.innerHTML = status === "ON" ? "● ON" : "● OFF";
          }
        });
        
        onValue(humidifierRef, (snapshot) => {
          const status = snapshot.val() || "OFF";
          const statusSpan = document.querySelector(`#humidifier-status-${deviceId} span`);
          if (statusSpan) {
            statusSpan.className = `status-badge ${status === "ON" ? "status-on" : "status-off"}`;
            statusSpan.innerHTML = status === "ON" ? "● ON" : "● OFF";
          }
        });
      }
      
      const alertsRef = ref(db, `alerts/${deviceId}`);
      onValue(alertsRef, (snapshot) => {
        const alerts = snapshot.val();
        const alertLog = document.getElementById(`alert-log-${deviceId}`);
        if (alerts && alertLog) {
          const alertArray = Object.values(alerts).slice(-5).reverse();
          alertLog.innerHTML = alertArray.map(alert => `
            <div class="alert-item">🚨 ${new Date(alert.timestamp).toLocaleString()} - ${alert.message}</div>
          `).join('');
        }
      });
      
      const sensorRef = ref(db, `logs/${deviceId}`);
      onValue(sensorRef, (snapshot) => {
        let latestTemp = 0, latestHum = 0;
        snapshot.forEach(child => {
          latestTemp = child.val().temperature;
          latestHum = child.val().humidity;
        });
        
        const readingsDiv = document.getElementById(`current-readings-${deviceId}`);
        if (readingsDiv) {
          const tempClass = latestTemp > 30 ? "temp-high" : (latestTemp < 20 ? "temp-low" : "");
          readingsDiv.innerHTML = `📊 Current: <span class="${tempClass}">${latestTemp.toFixed(1)}°C</span> | Humidity: ${latestHum.toFixed(1)}%`;
        }
      });
    }
    
    window.controlDevice = async function(deviceId, device, state) {
      if (currentUserRole !== "admin") {
        const accessRef = ref(db, `access_control/${currentUserId}`);
        const snapshot = await get(accessRef);
        const hasAccess = snapshot.exists() ? snapshot.val().hasAccess === true : true;
        
        if (!hasAccess) {
          showToast("❌ Access Denied! Please contact administrator.", "error");
          return;
        }
      }
      
      try {
        const controlRef = ref(db, `controls/${deviceId}/${device}`);
        await set(controlRef, state);
        
        const message = `${device.toUpperCase()} turned ${state}`;
        showToast(message, state === "ON" ? "success" : "info");
        
        const actionRef = ref(db, `actions/${deviceId}/${Date.now()}`);
        await set(actionRef, {
          device: device,
          action: state,
          timestamp: Date.now(),
          triggeredBy: currentUserRole === "admin" ? "admin" : "user",
          userId: currentUserId
        });
        
      } catch (error) {
        console.error("Control error:", error);
        showToast("Failed to control device", "error");
      }
    };
    
    function updateAutoLogic(deviceId, temperature, humidity) {
      if (!userHasAccess && currentUserRole !== "admin") return;
      
      const acRef = ref(db, `controls/${deviceId}/ac`);
      get(acRef).then(snapshot => {
        const currentAC = snapshot.val() || "OFF";
        
        if (temperature > 30 && currentAC === "OFF") {
          set(acRef, "ON");
          addAlert(deviceId, `🌡️ AC turned ON automatically - Temperature reached ${temperature}°C`);
        } else if (temperature < 25 && currentAC === "ON") {
          set(acRef, "OFF");
          addAlert(deviceId, `❄️ AC turned OFF automatically - Temperature dropped to ${temperature}°C`);
        }
        
        const autoSpan = document.getElementById(`ac-auto-status-${deviceId}`);
        if (autoSpan) {
          autoSpan.innerHTML = temperature > 30 ? "AC should be ON" : (temperature < 25 ? "AC should be OFF" : "Normal");
        }
      });
      
      const humidifierRef = ref(db, `controls/${deviceId}/humidifier`);
      get(humidifierRef).then(snapshot => {
        const currentHum = snapshot.val() || "OFF";
        
        if (humidity < 40 && currentHum === "OFF") {
          set(humidifierRef, "ON");
          addAlert(deviceId, `💧 Humidifier turned ON automatically - Humidity dropped to ${humidity}%`);
        } else if (humidity > 60 && currentHum === "ON") {
          set(humidifierRef, "OFF");
          addAlert(deviceId, `💨 Humidifier turned OFF automatically - Humidity reached ${humidity}%`);
        }
        
        const autoSpan = document.getElementById(`humidifier-auto-status-${deviceId}`);
        if (autoSpan) {
          autoSpan.innerHTML = humidity < 40 ? "Humidifier should be ON" : (humidity > 60 ? "Humidifier should be OFF" : "Normal");
        }
      });
      
      if (temperature > 35) {
        addAlert(deviceId, `🚨 EMERGENCY: Extreme heat detected! Temperature: ${temperature}°C - SMS sent to owner`);
        triggerGSMAlert(deviceId, "EXTREME_HEAT", temperature);
      } else if (temperature < 10) {
        addAlert(deviceId, `🚨 WARNING: Freezing condition! Temperature: ${temperature}°C - SMS sent to owner`);
        triggerGSMAlert(deviceId, "FREEZING", temperature);
      }
    }
    
    async function addAlert(deviceId, message) {
      const alertRef = ref(db, `alerts/${deviceId}/${Date.now()}`);
      await set(alertRef, {
        message: message,
        timestamp: Date.now(),
        type: "auto"
      });
    }
    
    async function triggerGSMAlert(deviceId, type, value) {
      const gsmRef = ref(db, `gsm_alerts/${deviceId}`);
      await set(gsmRef, {
        type: type,
        value: value,
        timestamp: Date.now(),
        status: "pending"
      });
      console.log(`📱 GSM Alert triggered for ${deviceId}: ${type} at ${value}°C`);
    }
    
    function showToast(message, type) {
      const toast = document.createElement("div");
      toast.style.position = "fixed";
      toast.style.bottom = "20px";
      toast.style.right = "20px";
      toast.style.padding = "15px 25px";
      toast.style.borderRadius = "10px";
      toast.style.color = "white";
      toast.style.zIndex = "1000";
      toast.style.animation = "slideIn 0.3s ease";
      
      toast.style.background = type === "success" ? "#2ecc71" : (type === "error" ? "#e74c3c" : "#3498db");
      toast.innerHTML = message;
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = "0";
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
</body>
</html>
