<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Smart Car Monitor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .auth-container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 550px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    .auth-container h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #2c3e50;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #2c3e50;
      font-size: 13px;
    }
    
    .auth-container input, .auth-container select {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    
    .auth-container input:focus, .auth-container select:focus {
      outline: none;
      border-color: #3498db;
    }
    
    .auth-container button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    
    .auth-container button:hover {
      background: #2980b9;
    }
    
    .auth-link {
      text-align: center;
      margin-top: 20px;
      color: #7f8c8d;
    }
    
    .auth-link a {
      color: #3498db;
      text-decoration: none;
    }
    
    .error-message {
      background: #e74c3c;
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      text-align: center;
      display: none;
    }
    
    .success-message {
      background: #2ecc71;
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      text-align: center;
      display: none;
    }
    
    .role-info {
      background: #ecf0f1;
      padding: 12px;
      border-radius: 8px;
      margin: 15px 0;
      font-size: 12px;
      text-align: center;
    }
    
    .required {
      color: #e74c3c;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <h2>🚗 Create Account</h2>
    <div id="errorMsg" class="error-message"></div>
    <div id="successMsg" class="success-message"></div>
    
    <div class="form-row">
      <div class="form-group">
        <label>👤 Full Name <span class="required">*</span></label>
        <input type="text" id="fullName" placeholder="Enter your full name">
      </div>
      <div class="form-group">
        <label>📱 Phone Number</label>
        <input type="tel" id="phone" placeholder="e.g., +250 788 123 456">
      </div>
    </div>
    
    <div class="form-group">
      <label>📧 Email Address <span class="required">*</span></label>
      <input type="email" id="email" placeholder="Enter your email">
    </div>
    
    <div class="form-row">
      <div class="form-group">
        <label>🔒 Password <span class="required">*</span></label>
        <input type="password" id="password" placeholder="Min 6 characters">
      </div>
      <div class="form-group">
        <label>🔒 Confirm Password <span class="required">*</span></label>
        <input type="password" id="confirmPassword" placeholder="Confirm password">
      </div>
    </div>
    
    <div class="form-group">
      <label>👑 Select Role</label>
      <select id="role">
        <option value="user">👤 Standard User (View assigned devices)</option>
        <option value="admin" id="adminOption">👑 Administrator (Full access)</option>
      </select>
    </div>
    
    <div class="role-info" id="roleInfo">
      ℹ️ Checking admin status...
    </div>
    
    <button id="registerBtn">Register</button>
    
    <div class="auth-link">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAHeN_fylzenZiANfd_RphzsqBuxjif3sY",
      authDomain: "temp-hum-c4be4.firebaseapp.com",
      databaseURL: "https://temp-hum-c4be4-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "temp-hum-c4be4",
      storageBucket: "temp-hum-c4be4.firebasestorage.app",
      messagingSenderId: "788419887651",
      appId: "1:788419887651:web:1713c9f2595c539c04a796"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    async function checkAdminExists() {
      const adminOption = document.getElementById("adminOption");
      const roleInfo = document.getElementById("roleInfo");
      
      try {
        const usersRef = ref(db, "users");
        const snapshot = await get(usersRef);
        
        let adminExists = false;
        
        if (snapshot.exists()) {
          const users = snapshot.val();
          for (const uid in users) {
            if (users[uid].role === "admin") {
              adminExists = true;
              break;
            }
          }
        }
        
        if (adminExists) {
          adminOption.disabled = true;
          adminOption.textContent = "👑 Administrator (Already taken)";
          roleInfo.innerHTML = "⚠️ Admin account already exists. You can only register as Standard User.";
          roleInfo.style.background = "#fdebd0";
          roleInfo.style.color = "#e74c3c";
        } else {
          adminOption.disabled = false;
          adminOption.textContent = "👑 Administrator (Full access)";
          roleInfo.innerHTML = "✨ No admin exists. You can register as Administrator!";
          roleInfo.style.background = "#d5f4e6";
          roleInfo.style.color = "#27ae60";
        }
      } catch (error) {
        console.error("Error checking admin:", error);
      }
    }

    checkAdminExists();

    document.getElementById("registerBtn").addEventListener("click", register);

    async function register() {
      const fullName = document.getElementById("fullName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirmPassword").value;
      const selectedRole = document.getElementById("role").value;
      
      document.getElementById("errorMsg").style.display = "none";
      document.getElementById("successMsg").style.display = "none";

      if (!fullName || !email || !password || !confirm) {
        showError("Please fill all required fields (*)");
        return;
      }

      if (password !== confirm) {
        showError("Passwords do not match");
        return;
      }

      if (password.length < 6) {
        showError("Password must be at least 6 characters");
        return;
      }

      const btn = document.getElementById("registerBtn");
      const originalText = btn.innerText;
      btn.innerText = "Creating account...";
      btn.disabled = true;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        
        await updateProfile(user, { displayName: fullName });
        
        let finalRole = selectedRole;
        
        if (finalRole === "admin") {
          const usersRef = ref(db, "users");
          const snapshot = await get(usersRef);
          let adminExists = false;
          
          if (snapshot.exists()) {
            const users = snapshot.val();
            for (const uid in users) {
              if (users[uid].role === "admin") {
                adminExists = true;
                break;
              }
            }
          }
          
          if (adminExists) {
            finalRole = "user";
          }
        }
        
        await set(ref(db, "users/" + user.uid), {
          fullName: fullName,
          phone: phone || "",
          email: email,
          createdAt: Date.now(),
          role: finalRole,
          registrationNumber: "",
          indexNumber: "",
          nationalId: "",
          college: "",
          department: "",
          program: "",
          sponsorship: "",
          address: ""
        });
        
        await set(ref(db, `access_control/${user.uid}`), {
          hasAccess: true,
          updatedBy: "system",
          updatedAt: Date.now()
        });
        
        const roleMessage = finalRole === "admin" ? "Administrator" : "Standard User";
        
        showSuccess(`✅ Registration successful! Welcome ${fullName}! You are registered as ${roleMessage}. Redirecting to login...`);
        
        setTimeout(() => {
          window.location.href = "login.html";
        }, 2000);
        
      } catch (error) {
        console.error("Registration error:", error);
        
        switch (error.code) {
          case 'auth/email-already-in-use':
            showError("❌ Email already registered. Please login or use a different email.");
            break;
          case 'auth/invalid-email':
            showError("❌ Invalid email address.");
            break;
          case 'auth/operation-not-allowed':
            showError("❌ Email/Password authentication is not enabled. Please enable it in Firebase Console.");
            break;
          case 'auth/weak-password':
            showError("❌ Password is too weak. Use at least 6 characters.");
            break;
          default:
            showError("❌ " + error.message);
        }
      } finally {
        btn.innerText = originalText;
        btn.disabled = false;
      }
    }

    function showError(message) {
      const errorDiv = document.getElementById("errorMsg");
      errorDiv.innerText = message;
      errorDiv.style.display = "block";
      setTimeout(() => {
        errorDiv.style.display = "none";
      }, 5000);
    }

    function showSuccess(message) {
      const successDiv = document.getElementById("successMsg");
      successDiv.innerText = message;
      successDiv.style.display = "block";
    }
  </script>
</body>
</html>
